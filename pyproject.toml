[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-nutrition-optimizer"
version = "1.3.0"
description = "Evidence-traced fruit nutrient cost optimization and mixed-integer purchase planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2", "requests>=2.31,<3"]

[project.scripts]
fruitopt = "fruit_optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["fruit_optimizer*"]

